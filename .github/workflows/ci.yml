name: Forma CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: forma-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: forma_test
          POSTGRES_USER: forma_test
          POSTGRES_PASSWORD: forma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forma_test -d forma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://forma_test:forma_test@127.0.0.1:5432/forma_test
      PORT: "4100"
      HOST: 127.0.0.1
      FRONTEND_ORIGIN: http://localhost:3000
      CUSTOMER_APP_ORIGIN: http://localhost:3000
      ADMIN_MFA_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AUTH_LOCAL_DEV_LINKS: "true"
      ADMIN_LOCAL_SETUP_ENABLED: "true"
      COD_ENABLED: "false"
      FORMA_API_URL: http://127.0.0.1:4100
      TEST_API_URL: http://127.0.0.1:4100
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      APP_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend typecheck and config tests
        working-directory: backend
        run: |
          npm run typecheck
          npm run test:runtime-config
          npm run test:payments
          npm run test:fulfillment
          npm run test:ai-imagery
      - name: PostgreSQL migrations, sample seed and backend integration tests
        working-directory: backend
        run: npm run test:integration
      - name: Start API for browser acceptance
        working-directory: backend
        run: |
          (npm start > "$RUNNER_TEMP/forma-api.log" 2>&1 & echo $! > "$RUNNER_TEMP/forma-api.pid")
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4100/ready; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/forma-api.log"
          exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck, unit and catalogue tests
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run test:node
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: End-to-end browser acceptance against PostgreSQL-backed API
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forma-playwright-failure-artifacts
          path: |
            frontend/test-results/
            ${{ runner.temp }}/forma-api.log
          if-no-files-found: ignore
